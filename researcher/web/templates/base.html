<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Researcher{% endblock %}</title>
<style>
  :root { --bg:#fbfbf9; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --accent:#2457a6; --chip:#efeee8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#e8e7e2; --muted:#9a9993; --line:#2c2c2a; --accent:#7aa7ef; --chip:#242422; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 1rem 16px 4rem; }
  header { display:flex; gap:1rem; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:.5rem; margin-bottom:1rem; }
  header a.home { font-weight:700; color:var(--fg); text-decoration:none; }
  a { color: var(--accent); }
  a.cite { text-decoration:none; font-size:.85em; vertical-align: super; line-height:0; }
  .muted { color: var(--muted); font-size:.9rem; }
  .chip { display:inline-block; padding:0 .5rem; border-radius:999px; background:var(--chip); font-size:.8rem; }
  .chip.running { color:#a86a00; } .chip.failed { color:#b3261e; } .chip.done { color:#1e7a3a; }
  ul.tasks { list-style:none; padding:0; margin:0; }
  ul.tasks li { padding:.75rem 0; border-bottom:1px solid var(--line); }
  ul.tasks a { font-weight:600; text-decoration:none; }
  pre, code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:.9em; }
  pre { overflow-x:auto; background:var(--chip); padding:.75rem; border-radius:6px; }
  img { max-width:100%; height:auto; }
  table { border-collapse:collapse; display:block; overflow-x:auto; }
  td, th { border:1px solid var(--line); padding:.25rem .5rem; }
  .doc { overflow-wrap:anywhere; }
  textarea, input[type=text] { width:100%; font:inherit; padding:.5rem; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
  button { font:inherit; padding:.4rem 1rem; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #log { font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; background:var(--chip); padding:.75rem; border-radius:6px; max-height:24rem; overflow-y:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
<header><a class="home" href="/">Researcher</a><a class="muted" href="/health">health</a></header>
{% block content %}{% endblock %}
</main>
</body>
</html>
